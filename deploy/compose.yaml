# The boating simulator's own stack. It has no public ports: the shared
# proxy (~/proxy) reaches it as "boating:3000" on the "web" network.
# Run from this folder:  docker compose up -d --build
name: boating                     # explicit, so another project's "deploy" folder can't collide
services:
  app:
    build: ..
    restart: unless-stopped
    environment:
      TRUST_PROXY: "1"            # Caddy is one proxy hop in front
      MAX_CONCURRENT_RUNS: "4"
      MAX_RUNS_PER_IP: "1"
      RUNS_PER_MINUTE_PER_IP: "20"
      MAX_RUN_SECONDS: "1050"     # fits the worst case: 5 boats, 200 visitors, slowest speed, longest times (~1032 s)
    expose:
      - "3000"
    mem_limit: 512m
    pids_limit: 2048              # 4 runs x up to 221 threads, with headroom
    networks:
      web:
        aliases:
          - boating               # the name the proxy uses; unique per project

networks:
  web:
    external: true
