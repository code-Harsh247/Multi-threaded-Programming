# Production stack: the simulator behind Caddy (automatic HTTPS).
# Run from this folder:  docker compose up -d --build
# SITE_ADDRESS comes from deploy/.env, e.g. SITE_ADDRESS=129-146-10-20.sslip.io
services:
  app:
    build: ..
    restart: unless-stopped
    environment:
      TRUST_PROXY: "1"            # Caddy is one proxy hop in front
      MAX_CONCURRENT_RUNS: "4"
      MAX_RUNS_PER_IP: "1"
      RUNS_PER_MINUTE_PER_IP: "20"
      MAX_RUN_SECONDS: "180"
    expose:
      - "3000"
    mem_limit: 512m
    pids_limit: 2048              # 4 runs x up to 221 threads, with headroom

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data          # certificates live here; keep this volume
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
